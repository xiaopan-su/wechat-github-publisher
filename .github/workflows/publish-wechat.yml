name: publish-wechat

on:
  push:
    branches: [main]
    paths:
      - "articles/*.md"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 打印出口IP(首次加入IP白名单用)
        run: curl -s ifconfig.me | tee ip.txt && cat ip.txt

      - name: 检测新增/修改的文章
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=d HEAD~1 2>/dev/null -- 'articles/*.md' || git show --name-only --diff-filter=d HEAD -- 'articles/*.md' | grep '^articles/')
          echo "files=$FILES"
          echo "$FILES" > /tmp/files.txt
          echo "count=$(echo "$FILES" | grep -c . || echo 0)" >> "$GITHUB_OUTPUT"

      - name: 发布到草稿箱
        if: steps.changed.outputs.count != '0'
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "== 发布 $f =="
            python scripts/publish_wechat.py "$f"
          done < /tmp/files.txt
