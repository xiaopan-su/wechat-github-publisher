name: publish-wechat

on:
  push:
    branches: [main]
    paths:
      - "articles/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 打印出口IP
        run: |
          echo "Actions出口IP, 首次需加入公众号IP白名单: $(curl -s -m 10 ifconfig.me)"

      - name: 检测待发布文章
        id: changed
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            FILES=$(ls articles/*.md 2>/dev/null || true)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- 'articles/*.md' 2>/dev/null || true)
            [ -z "$FILES" ] && FILES=$(ls articles/*.md 2>/dev/null || true)
          fi
          echo "$FILES" > /tmp/files.txt
          echo "=== 待发布 ==="
          cat /tmp/files.txt
          N=$(grep -c . /tmp/files.txt || true)
          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: 发布到草稿箱
        if: steps.changed.outputs.count != '0'
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
        run: |
          set -e
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            echo "== 发布 $f =="
            python scripts/publish_wechat.py "$f"
          done < /tmp/files.txt
          echo "=== 完成, 去公众号后台草稿箱群发 ==="
